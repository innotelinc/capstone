; Asterisk Console (innotelinc/asterisk-console) AMI access.
;
; TEMPLATE — do not edit the copy in the asterisk-config volume. On every boot
; pbx/entrypoint-dograh.sh (ensure_console_ami) renders this file into
; /etc/asterisk/manager_console.conf with the secret from CONSOLE_AMI_SECRET and
; adds `#include manager_console.conf` to manager_custom.conf.
;
; Kept out of manager_custom.conf on purpose: the stock image entrypoint
; rewrites every `secret =` line in that file at boot, which would silently
; invalidate the console's credential (observed live: AMI login failed after a
; redeploy until the user moved here).
;
; AMI itself is pinned to loopback (manager.conf bindaddr = 127.0.0.1) and NOT
; published on the compose network: the ami-bridge socat sidecar shares the
; freepbx container's network namespace and exposes 15038 → 127.0.0.1:5038,
; which is how the console (ami_host=freepbx, ami_port=15038) reaches it. So the
; ACL only needs loopback.
;
; ORDER MATTERS: Asterisk takes the LAST matching ACL entry, so the permit must
; follow the deny.
[asterisk-console]
secret = CHANGE_ME_CONSOLE_AMI_SECRET
deny = 0.0.0.0/0.0.0.0
read = system,call,log,verbose,agent,user,config,reporting,cdr,dialplan
write = command
permit = 127.0.0.1/255.255.255.255
eventfilter = !Event: VarSet
eventfilter = !Event: Newexten
eventfilter = !Event: DTMFBegin
eventfilter = !Event: DTMFEnd
eventfilter = !Event: RTPTimeout
